[project]
name = "sprintboard-tagger"
version = "0.1.0"
description = "Local image-tagging services for Sprintboard"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.0",
    "huggingface-hub>=0.20.0",
    "pillow>=12.0.0",
    "timm>=0.9.16",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
sprintboard-tagger = "sprintboard_tagger.cli:main"
sprintboard-cl-tagger = "sprintboard_tagger.cl_cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
]
cl = [
    "numpy>=2.0.0",
    "onnxruntime-gpu>=1.28.0; sys_platform == 'win32'",
    "onnxruntime>=1.28.0; sys_platform != 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprintboard_tagger"]
